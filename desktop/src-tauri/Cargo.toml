[package]
name = "agroplano_demo"
version = "1.3.2"
description = "Bilingual AgroPlano Management Demo with operational workflows and synthetic data"
authors = ["Tomás Krick"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
