    <text x="384" y="62" text-anchor="middle" font-size="12">COMPASS SECTOR</text>
    <text x="620" y="62" text-anchor="middle" font-size="12">STREAM SECTOR</text>
    <text x="839" y="62" text-anchor="middle" font-size="12">DELTA SECTOR</text>
