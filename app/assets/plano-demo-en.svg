    <g transform="translate(438 276)"><circle r="8" fill="#428bab" stroke="#fff" stroke-width="3"/><circle r="3" fill="#c9ecf2"/><text x="13" y="3" font-size="9" font-weight="750" fill="#49636b">Water B</text></g>
    <g transform="translate(606 470)"><circle r="8" fill="#428bab" stroke="#fff" stroke-width="3"/><circle r="3" fill="#c9ecf2"/><text x="13" y="3" font-size="9" font-weight="750" fill="#49636b">Water C</text></g>
    <g transform="translate(846 256)"><circle r="8" fill="#428bab" stroke="#fff" stroke-width="3"/><circle r="3" fill="#c9ecf2"/><text x="13" y="3" font-size="9" font-weight="750" fill="#49636b">Water D</text></g>
    <g transform="translate(840 552)">
